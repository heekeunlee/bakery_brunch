name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 자동 수집 워크플로가 데이터를 갱신한 뒤 이어서 호출한다.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 최신 커밋 하나만 살아남으면 된다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 기본 checkout 은 워크플로를 트리거한 커밋(github.sha)을 가져온다.
      # 자동 수집이 데이터를 커밋한 뒤 이 워크플로를 호출하는 경로에서는
      # 그 커밋이 트리거 시점보다 뒤에 있어 갱신분이 배포에서 누락된다.
      # 항상 main 최신을 명시적으로 체크아웃한다.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 빌드
        run: npm run build
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.VITE_KAKAO_JS_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
