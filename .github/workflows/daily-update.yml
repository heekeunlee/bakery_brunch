name: 매주 목요일 자동 수집

on:
  schedule:
    # GitHub cron 은 UTC 기준. 수요일 21:00 UTC = 목요일 06:00 KST.
    - cron: '0 21 * * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: '수집 범위'
        required: false
        default: 'all'
        type: choice
        options:
          - all      # 전국 전체 (기본, 주간 자동 실행이 쓰는 방식)
          - missing  # 아직 한 곳도 못 건진 지역만
          - shard    # 전국을 며칠로 나눈 조각 하나만
      region:
        description: '특정 지역만 수집 (예: 강릉시). 입력하면 mode 보다 우선합니다.'
        required: false
        type: string
      shards:
        description: 'shard 모드에서 전국을 몇 조각으로 나눌지 (기본 7)'
        required: false
        default: '7'
        type: string

# 재사용 워크플로(deploy.yml)의 권한은 호출하는 쪽 권한을 상한으로 잘린다.
# Pages 배포까지 이어가려면 여기서 pages/id-token 도 함께 열어줘야 한다.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 전국 일괄 수집은 3시간 안팎이 걸린다. 기본 6시간 제한 안에는 들지만
    # 무한정 매달리지 않도록 명시해 둔다.
    timeout-minutes: 330
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 시크릿 확인
        id: guard
        run: |
          if [ -z "${{ secrets.NAVER_CLIENT_ID }}" ] || [ -z "${{ secrets.KAKAO_REST_KEY }}" ]; then
            echo "::warning::NAVER_CLIENT_ID / KAKAO_REST_KEY 시크릿이 없어 수집을 건너뜁니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집 실행
        if: steps.guard.outputs.ok == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          # 스케줄 실행에는 inputs 가 비어 있다. 주 1회로 바뀐 뒤로는 전국을 한 번에 돈다 —
          # 샤드 순환(연중 일수 % 7)은 7일 간격으로 돌면 매번 같은 조각만 걸려 무의미하다.
          if [ -n "${{ inputs.region }}" ]; then
            node scripts/run.mjs --region "${{ inputs.region }}"
          else
            case "${{ inputs.mode || 'all' }}" in
              missing) node scripts/run.mjs --missing ;;
              shard)   node scripts/run.mjs --shard auto --shards "${{ inputs.shards || '7' }}" ;;
              *)       node scripts/run.mjs --all ;;
            esac
          fi

      - name: 변경분 커밋
        id: commit
        if: steps.guard.outputs.ok == 'true'
        run: |
          if git diff --quiet -- public/data/places.json; then
            echo "데이터 변경 없음."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOTAL=$(node -e "console.log(require('./public/data/places.json').count)")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/places.json
          git commit -m "데이터 자동 갱신: 총 ${TOTAL}곳 ($(date -u -d '+9 hours' '+%Y-%m-%d'))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # 데이터가 실제로 바뀐 날에만 다시 배포한다.
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
